<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>BLACKMERQURY — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page{min-height:100svh;display:grid;place-items:center;padding:32px 20px}
    .admin-card{width:min(100%,420px);border:1px solid #292929;background:rgba(12,13,15,.92);padding:42px}
    .admin-kicker{font-size:9px;letter-spacing:.24em;color:#888;text-transform:uppercase}
    .admin-card h1{font-size:27px;font-weight:300;letter-spacing:.12em;margin:18px 0 8px}
    .admin-card p{font-size:12px;line-height:1.8;color:#999}
    .admin-status{margin-top:28px;padding:15px;border-left:1px solid #777;background:#ffffff08;color:#aaa;font-size:10px;line-height:1.8;letter-spacing:.04em}
    .admin-back{display:inline-block;margin-top:28px;font-size:9px;letter-spacing:.18em;color:#ddd}
    @media(max-width:520px){.admin-card{padding:30px 24px}}
  </style>
</head>
<body>
  <main class="admin-page">
    <section class="admin-card">
      <div class="admin-kicker">BLACKMERQURY / PRIVATE ACCESS</div>
      <h1>ADMINISTRATION</h1>
      <p>Website content management and portfolio control.</p>
      <div class="admin-status">ADMIN PANEL SETUP IN PROGRESS<br>Secure sign-in and editing tools are not connected yet. This page does not accept or store passwords.</div>
      <a class="admin-back" href="/">← BACK TO WEBSITE</a>
    </section>
  </main>
</body>
</html>
