<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>BLACKMERQURY — Orbital Particle Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:Manrope,sans-serif;background:#08090b;color:#f2f2f2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b}
#space{position:fixed;inset:0}#space canvas{display:block;width:100%;height:100%}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(8,9,11,.2) 66%,#08090b 115%)}
header,main,footer,.controls{position:relative;z-index:2}header{height:82px;padding:0 5.2vw;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:12px;font-weight:600;letter-spacing:.34em}.tag{font-size:9px;letter-spacing:.2em;color:#92939b}
main{height:calc(100svh - 142px);display:grid;place-items:center;text-align:center;pointer-events:none}
.hero{transform:translateY(-2vh)}.eyebrow{font-size:9px;letter-spacing:.23em;color:#a2a2aa;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,76px);font-weight:300;letter-spacing:.16em;margin:27px 0 10px;padding-left:.16em}
.sub{font-size:10px;letter-spacing:.32em;color:#a4a4ac;padding-left:.32em}
footer{position:fixed;left:5.2vw;bottom:34px;font-size:8px;letter-spacing:.16em;color:#777}
.controls{position:fixed;right:5.2vw;bottom:30px;display:flex;gap:8px}
.controls button{border:1px solid rgba(255,255,255,.16);background:rgba(8,9,11,.55);backdrop-filter:blur(8px);padding:9px 12px;color:#bbb;font:400 8px Manrope,sans-serif;letter-spacing:.15em;cursor:pointer}
.controls button:hover{color:white;border-color:rgba(255,255,255,.4)}
@media(max-width:600px){header{height:68px}.tag{font-size:7px}main{height:calc(100svh - 110px)}footer{left:5vw;bottom:28px;font-size:7px}.controls{right:5vw;bottom:18px}.controls button{padding:8px 9px;font-size:7px}}
</style></head>
<body>
<div id="space" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<header><div class="brand">BLACKMERQURY</div><div class="tag">INDEPENDENT CREATIVE STUDIO · BUDAPEST</div></header>
<main><section class="hero"><p class="eyebrow">An independent creative environment</p><h1>BLACKMERQURY</h1><p class="sub">VISUAL ALCHEMY</p></section></main>
<footer>ORBITAL PARTICLE FIELD · CODE STUDY</footer>
<div class="controls"><button id="motion-toggle">PAUSE MOTION</button><button id="quality-toggle">REDUCED PARTICLES</button></div>
<script type="module" src="/particle-space/orbit-preview.js"></script>
</body></html>
